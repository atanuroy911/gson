# Control A: created, never touched again by anything -> expect "unused"
# Control B: created, read in the same job via a plain shell command -> expect "used"
# Test C: created, uploaded as an artifact, but nothing ever downloads it -> the question
# Test D: created, copied into a Docker image via COPY -> does docker build count as a read?

name: Modified Research Isolated Consumption
jobs:
  isolated-test:
    name: isolated-test
    runs-on: ubuntu-latest
    steps:
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |-
        python -m pip install --upgrade pip
        pip install inotify
    - name: Run inotifywait
      run: |-
        python3 -c "
        import inotify.adapters
        import inotify.constants
        import os
        from datetime import datetime, timezone
        with open('/home/runner/inotifywait-log-isolated-test.csv', 'w') as log_file:
          i = inotify.adapters.InotifyTree('/home/runner/work/gson/gson', inotify.constants.IN_CREATE | inotify.constants.IN_ACCESS)
          for event in i.event_gen(yield_nones=False):
            (_, type_names, path, filename) = event
            now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f') + 'Z'
            events = ','.join(type_names)
            log_file.write(f'{now};{path};{filename};{events}\n')
            log_file.flush()
            os.fsync(log_file.fileno())
        " &
    - uses: actions/checkout@v4
    - run: touch optcd-3.txt
    - name: Create variant A (never touched)
      run: |-
        mkdir -p research-artifacts/variant-a
        echo "control: never read" > research-artifacts/variant-a/data.txt
    - run: touch optcd-4.txt
    - name: Create variant B (read in-job)
      run: |-
        mkdir -p research-artifacts/variant-b
        echo "control: read in job" > research-artifacts/variant-b/data.txt
    - run: touch optcd-5.txt
    - name: Read variant B
      run: cat research-artifacts/variant-b/data.txt
    - run: touch optcd-6.txt
    - name: Create variant C (orphan upload)
      run: |-
        mkdir -p research-artifacts/variant-c
        echo "test: uploaded but never downloaded" > research-artifacts/variant-c/data.txt
    - run: touch optcd-7.txt
    - name: Upload variant C
      uses: actions/upload-artifact@v4
      with:
        name: variant-c-orphan
        path: research-artifacts/variant-c/data.txt
    - run: touch optcd-8.txt
    - name: Create variant D (docker COPY)
      run: |-
        mkdir -p research-artifacts/variant-d
        echo "test: copied into docker image" > research-artifacts/variant-d/data.txt
    - run: touch optcd-9.txt
    - name: Docker build consuming variant D
      run: |-
        cat > Dockerfile.research-d <<'EOF'
        FROM alpine:3.20
        COPY research-artifacts/variant-d/data.txt /data.txt
        EOF
        docker build -f Dockerfile.research-d -t research-image-d .
    - run: touch optcd-10.txt
    - name: Upload inotifywait logs
      uses: actions/upload-artifact@v4
      with:
        name: inotifywait-isolated-test
        path: /home/runner/inotifywait-log-isolated-test.csv
'on':
- push
- workflow_dispatch
