
name: Modified Research Consumption Paths
jobs:
  docker-copy-test:
    name: docker-copy-test
    runs-on: ubuntu-latest
    steps:
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |-
        python -m pip install --upgrade pip
        pip install inotify
    - name: Run inotifywait
      run: |-
        python3 -c "
        import inotify.adapters
        import inotify.constants
        import os
        from datetime import datetime, timezone
        with open('/home/runner/inotifywait-log-docker-copy-test.csv', 'w') as log_file:
          i = inotify.adapters.InotifyTree('/home/runner/work/gson/gson', inotify.constants.IN_CREATE | inotify.constants.IN_ACCESS)
          for event in i.event_gen(yield_nones=False):
            (_, type_names, path, filename) = event
            now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f') + 'Z'
            events = ','.join(type_names)
            log_file.write(f'{now};{path};{filename};{events}\n')
            log_file.flush()
            os.fsync(log_file.fileno())
        " &
    - uses: actions/checkout@v4
    - run: touch optcd-3.txt
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - run: touch optcd-4.txt
    - name: Build jar
      run: mvn -q -B package -DskipTests --projects gson --also-make
    - run: touch optcd-5.txt
    - name: Docker build consuming jar via COPY
      run: |-
        cat > Dockerfile.research <<'EOF'
        FROM alpine:3.20
        COPY gson/target/*.jar /app.jar
        EOF
        docker build -f Dockerfile.research -t research-image .
    - run: touch optcd-6.txt
    - name: Upload inotifywait logs
      uses: actions/upload-artifact@v4
      with:
        name: inotifywait-docker-copy-test
        path: /home/runner/inotifywait-log-docker-copy-test.csv
  orphan-upload-test:
    name: orphan-upload-test
    runs-on: ubuntu-latest
    steps:
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |-
        python -m pip install --upgrade pip
        pip install inotify
    - name: Run inotifywait
      run: |-
        python3 -c "
        import inotify.adapters
        import inotify.constants
        import os
        from datetime import datetime, timezone
        with open('/home/runner/inotifywait-log-orphan-upload-test.csv', 'w') as log_file:
          i = inotify.adapters.InotifyTree('/home/runner/work/gson/gson', inotify.constants.IN_CREATE | inotify.constants.IN_ACCESS)
          for event in i.event_gen(yield_nones=False):
            (_, type_names, path, filename) = event
            now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f') + 'Z'
            events = ','.join(type_names)
            log_file.write(f'{now};{path};{filename};{events}\n')
            log_file.flush()
            os.fsync(log_file.fileno())
        " &
    - uses: actions/checkout@v4
    - run: touch optcd-3.txt
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - run: touch optcd-4.txt
    - name: Build jar
      run: mvn -q -B package -DskipTests --projects gson --also-make
    - run: touch optcd-5.txt
    - name: Upload artifact that nothing ever downloads
      uses: actions/upload-artifact@v4
      with:
        name: orphan-jar
        path: gson/target/*.jar
    - run: touch optcd-6.txt
    - name: Upload inotifywait logs
      uses: actions/upload-artifact@v4
      with:
        name: inotifywait-orphan-upload-test
        path: /home/runner/inotifywait-log-orphan-upload-test.csv
'on':
- push
- workflow_dispatch
