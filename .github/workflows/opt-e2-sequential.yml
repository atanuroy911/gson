# 001-investigation E2 (e2-sequential): gson build.yml "build" job, JDK 17 only.
# Only difference between variants: "-T 4" (parallel module builds) on the Maven command.

name: Modified E2 e2-sequential
'on':
  - push
  - workflow_dispatch
env:
  MAVEN_ARGS: --show-version --batch-mode --no-transfer-progress
jobs:
  build:
    name: build (${{ matrix.java }})
    strategy:
      matrix:
        java:
          - 17
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |-
          python -m pip install --upgrade pip
          pip install inotify
      - name: Run inotifywait
        run: |-
          python3 -c "
          import inotify.adapters
          import inotify.constants
          import os
          from datetime import datetime, timezone
          with open('/home/runner/inotifywait-log-build (${{ matrix.java }}).csv', 'w') as log_file:
            i = inotify.adapters.InotifyTree('/home/runner/work/gson/gson', inotify.constants.IN_CREATE | inotify.constants.IN_ACCESS)
            for event in i.event_gen(yield_nones=False):
              (_, type_names, path, filename) = event
              now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f') + 'Z'
              events = ','.join(type_names)
              log_file.write(f'{now};{path};{filename};{events}\n')
              log_file.flush()
              os.fsync(log_file.fileno())
          " &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: touch optcd-3.txt
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: touch optcd-4.txt
      - name: Build with Maven
        run: mvn verify javadoc:jar -DdisableXmlReport=true -Dmaven.compiler.useIncrementalCompilation=false
          -Dmaven.javadoc.skip=true -Dspotless.check.skip=true
      - run: touch optcd-5.txt
      - name: Upload inotifywait logs
        uses: actions/upload-artifact@v4
        with:
          name: inotifywait-build (${{ matrix.java }})
          path: /home/runner/inotifywait-log-build (${{ matrix.java }}).csv
